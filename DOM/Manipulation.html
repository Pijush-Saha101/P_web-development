<!-- example 2 - change the tag itself -->
<!-- update Tag - innerHTML - Which help us to update Tag & content as well -->
 <button id="btn">Login</button>
    <p id="mp"> Welcome guest</p>
    <p id = "abc"> this is old paragraph tag</p>

    <div id="tag" style="background-color: bisque;">This change Tag itself</div>

    <ul id="xyz" >
        <li >Gym</li>
    </ul>
 

    <script>
        //Update text content

        const button = document.getElementById("btn")

        console.log(button)

        console.log(button.textContent)

        button.textContent = "Logout"

        const paragraph = document.getElementById("mp")
        paragraph.textContent = "Good evening P"

        const container = document.getElementById("tag")
        console.log(container)
        // container.innerHTML="<h2>Now div change to h2 tag </h2>"

        // To change multiple html tag use backtick (` `) instade of (" ") and rest is same
        
        container.innerHTML=`
        
        <p> This is <mark>Updatte</mark> Tag</p>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT5adp6pQ7oXibO33iupBFYr7OLtXmxjh9cEwK9WQXFbg&s=10" hight="150px" width="200px"><br>
        <button>Smile</button>
        `
        // example 3- change CSS property
        const para = document.getElementById("abc")
        // to change CSS property we use .style.propertyName
        para.style.color = "red"
        para.style.backgroundColor="black"
        para.style.textAlign = "center"
        para.textContent = "This is new paragraph tag"


    //example 4- create element/tag through Js  
        const list =document.getElementById("xyz")

        const li2 = document.createElement("li")
        li2.textContent = "Office"
        li2.style.color ="red" 

        // parentName.appendChild(tagName)
        list.appendChild(li2)
        



    </script>
</body>
